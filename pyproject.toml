[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "commerce-agent-eval"
version = "0.3.0rc2"
description = "Framework-neutral evaluation platform for tool-using commerce agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Commerce Agent Eval contributors" }]
keywords = ["agent", "evaluation", "llm", "commerce", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.20,<5",
  "filelock>=3.16,<4",
  "python-dotenv>=1.0,<2",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
]

[project.scripts]
commerce-eval = "commerce_eval.cli:main"

[project.urls]
Homepage = "https://github.com/will7780/commerce-agent-eval"
Repository = "https://github.com/will7780/commerce-agent-eval"
Issues = "https://github.com/will7780/commerce-agent-eval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_eval"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "commerce_eval/demo_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["commerce_eval"]

