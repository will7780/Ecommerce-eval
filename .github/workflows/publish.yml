name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact candidate/release version in pyproject.toml
        required: true
        default: "0.3.0rc2"
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publication
  cancel-in-progress: false

env:
  COMMERCE_EVAL_DISABLE_CENTRAL_ENV: "1"
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build:
    if: github.repository == 'will7780/Ecommerce-eval' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and offline test tools
        run: python -m pip install build twine ".[dev]"
      - name: Offline regression
        run: python -m pytest
      - name: Build sdist and wheel from sdist
        run: python -m build
      - name: Validate release contents and metadata
        run: |
          python -m twine check --strict dist/*
          python tools/check_distribution.py dist --version "$RELEASE_VERSION"
      - name: Install and test the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/package-check"
          "$RUNNER_TEMP/package-check/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package-check/bin/python" "$GITHUB_WORKSPACE/tools/verify_installed_package.py" --version "$RELEASE_VERSION"
          "$RUNNER_TEMP/package-check/bin/commerce-eval" --database "$RUNNER_TEMP/release-demo.db" demo --seed-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/commerce-agent-eval/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish checked artifacts with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
